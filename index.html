<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Simple App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div class="brand-name">Simple App</div>
      </div>

      <h1>Masuk ke akun kamu</h1>
      <p class="subtitle">Gunakan email dan password yang sudah terdaftar.</p>

      <div id="message" class="msg" role="alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 placeholder="nama@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <div class="btn-row">
          <button type="submit" class="btn btn-primary">Login</button>
          <div class="divider">atau</div>
          <button type="button" class="btn btn-secondary" id="register-btn">Register</button>
        </div>
      </form>

      <p class="footnote">Belum punya akun? Klik <strong>Register</strong> untuk mendaftar.</p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var message = document.getElementById('message');
      var submitBtn = form.querySelector('button[type="submit"]');

      function show(text, kind) {
        message.textContent = text;
        message.className = 'msg show ' + kind;
      }

      // Already signed in? Go straight to the homepage.
      if (Auth.currentUser()) {
        location.replace('home.html');
      }

      // A fresh registration lands here with ?registered=1
      if (new URLSearchParams(location.search).get('registered') === '1') {
        show('Akun berhasil dibuat. Silakan login.', 'success');
      }

      document.getElementById('register-btn').addEventListener('click', function () {
        location.href = 'register.html';
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        message.className = 'msg';

        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;

        if (!email || !password) {
          show('Email dan password wajib diisi.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Memproses…';

        Auth.login(email, password)
          .then(function () {
            location.href = 'home.html';
          })
          .catch(function (err) {
            show(err.message, 'error');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Login';
            document.getElementById('password').value = '';
          });
      });
    })();
  </script>
</body>
</html>
